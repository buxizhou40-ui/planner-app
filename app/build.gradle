plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhou.planner'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhou.planner"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader：给网页一个虚拟 https 域名，解决 file:// 下 localStorage 失效
    implementation 'androidx.webkit:webkit:1.10.0'
}
