name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 准备 Android SDK（用 runner 预装的）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK 路径: $SDK"
          ls "$SDK/platforms" 2>/dev/null || echo "（platforms 目录为空）"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)
          echo "sdkmanager: $CMDLINE"
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$CMDLINE/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true
          fi
          echo "sdk.dir=$SDK" > local.properties

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
